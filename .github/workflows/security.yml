name: security

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit pip-audit
      # Fails the build on any high-severity finding.
      - name: bandit, high severity
        run: bandit -q -r . -x ./venv,./.venv,./scripts,./build,./dist,./.worktrees -lll
      # Medium findings are listed for review but do not fail the build. The
      # string-built SQL reports (B608) build column lists from fixed,
      # code-owned names and bind every value with a placeholder.
      - name: bandit, medium severity (report only)
        run: bandit -q -r . -x ./venv,./.venv,./scripts,./build,./dist,./.worktrees -ll
        continue-on-error: true
      # Known-vulnerable dependencies. Report only until the cryptography
      # version range in requirements.txt is decided.
      - name: pip-audit (report only)
        run: pip-audit -r requirements.txt
        continue-on-error: true
